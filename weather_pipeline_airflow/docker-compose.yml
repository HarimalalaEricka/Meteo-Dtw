version: '3.8'

services:

  # ─────────────────────────────────────────
  # BASE DE DONNÉES POSTGRESQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: weather_postgres
    environment:
      POSTGRES_USER     : airflow
      POSTGRES_PASSWORD : airflow
      POSTGRES_DB       : weather_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test      : ["CMD", "pg_isready", "-U", "airflow"]
      interval  : 10s
      timeout   : 5s
      retries   : 5

  # ─────────────────────────────────────────
  # AIRFLOW WEBSERVER
  # ─────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: weather_airflow_web
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR                : LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN    : postgresql+psycopg2://airflow:airflow@postgres/weather_db
      AIRFLOW__CORE__FERNET_KEY              : ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION : 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES           : 'false'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - ./logs:/opt/airflow/logs
      - ../weather_dbt:/opt/airflow/dbt_project
    ports:
      - "8080:8080"
    command: webserver

  # ─────────────────────────────────────────
  # AIRFLOW SCHEDULER
  # ─────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: weather_airflow_scheduler
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR             : LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN : postgresql+psycopg2://airflow:airflow@postgres/weather_db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - ./logs:/opt/airflow/logs
      - ../weather_dbt:/opt/airflow/dbt_project
    command: scheduler

volumes:
  postgres_data: