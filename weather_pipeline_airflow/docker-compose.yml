services:
  postgres:
    image: postgres:15
    container_name: weather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER     : airflow
      POSTGRES_PASSWORD : airflow
      POSTGRES_DB       : weather_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test      : ["CMD", "pg_isready", "-U", "airflow"]
      interval  : 10s
      timeout   : 5s
      retries   : 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: weather_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  airflow-init:
    build: .
    container_name: weather_airflow_init
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR             : LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN : postgresql+psycopg2://airflow:airflow@postgres/weather_db
      AIRFLOW__CORE__FERNET_KEY           : ""
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/dags/scripts
      - ./config:/opt/airflow/config
      - ./logs:/opt/airflow/logs
      - ../weather_dbt:/opt/airflow/dbt_project
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@local

  airflow-webserver:
    build: .
    container_name: weather_airflow_web
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR                    : LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN        : postgresql+psycopg2://airflow:airflow@postgres/weather_db
      AIRFLOW__CORE__FERNET_KEY                  : ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION : 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES                : 'false'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/dags/scripts
      - ./config:/opt/airflow/dags/config
      - ./logs:/opt/airflow/logs
      - ../weather_dbt:/opt/airflow/dbt_project
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build: .
    container_name: weather_airflow_scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR             : LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN : postgresql+psycopg2://airflow:airflow@postgres/weather_db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/dags/scripts
      - ./config:/opt/airflow/dags/config
      - ./logs:/opt/airflow/logs
      - ../weather_dbt:/opt/airflow/dbt_project
    command: scheduler

volumes:
  pgdata: